# Copies watch activities from intervals.icu into Supabase (scripts/sync-intervals.mjs).
# Runs every morning for the last 7 days; run it by hand with a start date for a backfill.
name: Sync intervals.icu activities

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC, about 07:00 in Spain
  workflow_dispatch:
    inputs:
      oldest:
        description: 'Backfill from this date (YYYY-MM-DD). Empty = the last 7 days.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sync-intervals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Sync
        run: node scripts/sync-intervals.mjs
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PISADA_USER_ID: ${{ secrets.PISADA_USER_ID }}
          OLDEST: ${{ inputs.oldest }}
