<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Pisada: a right footprint on the accent blue. Content stays inside the
       central 80% so it also works as a "maskable" (cropped) Android icon. -->
  <rect width="512" height="512" fill="#155dfc"/>
  <g fill="#ffffff" transform="translate(256 256) scale(0.85) translate(-303 -300)">
    <!-- sole: wide forefoot, narrow arch on the inside (left), round heel -->
    <path d="M292 196c40 6 62 44 58 92-4 44-22 70-24 104-2 30 6 52-6 72-14 22-50 24-66 4-14-18-6-44-10-72-4-30-30-56-32-104-2-56 34-102 80-96z"/>
    <!-- toes, big toe first -->
    <ellipse cx="236" cy="150" rx="27" ry="33"/>
    <ellipse cx="290" cy="132" rx="19" ry="23"/>
    <ellipse cx="332" cy="142" rx="16" ry="19"/>
    <ellipse cx="364" cy="164" rx="13" ry="16"/>
    <ellipse cx="386" cy="194" rx="11" ry="13"/>
  </g>
</svg>
