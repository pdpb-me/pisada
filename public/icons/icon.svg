<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Pisada: a right footprint ("pisada"), the arch cut in on the inner side, on the app's
       blue (--primary). The mark stays inside the central circle, so it also works as a
       maskable (cropped) Android icon. -->
  <rect width="512" height="512" fill="#006dc3"/>
  <g fill="#ffffff" transform="translate(256 256) scale(0.8) translate(-266 -290)">
    <g>
      <!-- right foot print: round heel, the arch cut in on the inner (left) side, wide forefoot -->
      <path d="M180 250 C 176 190 222 160 268 162 C 322 164 356 200 352 262 C 349 318 322 360 318 410 C 314 460 296 492 262 492 C 226 492 210 462 214 428 C 218 396 246 372 244 334 C 242 300 184 300 180 250 Z"/>
      <!-- three toes, big toe first (inner side) -->
      <circle cx="204" cy="116" r="36"/>
      <circle cx="272" cy="98" r="27"/>
      <circle cx="328" cy="116" r="22"/>
    </g>
    
  </g>
</svg>
